<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.6 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>솔루션 의뢰 인테이크</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: single 680px column, 5-step wizard, sticky progress rail.
   Almost every answer is a tap. Conditional questions carry an amber rail. */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface-2:#F6F8F7;
  --ink:#121A19; --ink-2:#42524F; --ink-3:#76847F;
  --line:#D4DAD7; --line-strong:#B6C0BC;
  --accent:#0B6158; --accent-soft:#DCEAE7; --accent-ink:#0B6158;
  --signal:#8F5400; --signal-soft:#F7ECD9; --ok:#2E6B3E; --danger:#B3261E;
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1413; --surface:#151E1D; --surface-2:#1B2524;
  --ink:#E6EDEA; --ink-2:#A8B6B2; --ink-3:#7C8A86;
  --line:#27302E; --line-strong:#3A4542;
  --accent:#4FD0BE; --accent-soft:#13302C; --accent-ink:#4FD0BE;
  --signal:#E3AC5C; --signal-soft:#2E2512; --ok:#7FBF8F; --danger:#F2A9A1;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1413; --surface:#151E1D; --surface-2:#1B2524;
  --ink:#E6EDEA; --ink-2:#A8B6B2; --ink-3:#7C8A86;
  --line:#27302E; --line-strong:#3A4542;
  --accent:#4FD0BE; --accent-soft:#13302C; --accent-ink:#4FD0BE;
  --signal:#E3AC5C; --signal-soft:#2E2512; --ok:#7FBF8F; --danger:#F2A9A1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:680px;margin:0 auto;padding:10px 20px 9px;display:flex;align-items:center;gap:14px}
.bar-id{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.track{flex:1;min-width:0;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s ease}
.bar-n{font-family:var(--mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

.wrap{max-width:680px;margin:0 auto;padding-inline:20px;padding-block:28px 72px}
.masthead{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:26px}
.masthead h1{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0 0 7px;text-wrap:balance}
.masthead p{margin:0;color:var(--ink-2);font-size:14px;max-width:52ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

.sec-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px}
.sec-title{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
.sec-note{color:var(--ink-2);font-size:13.5px;margin:0 0 24px;max-width:54ch}

.q{margin-bottom:26px}
.q.cond{border-left:2px solid var(--signal);padding-left:14px;margin-left:-16px}
.q-label{font-size:15px;font-weight:600;line-height:1.45;margin-bottom:3px;display:block}
.req{color:var(--accent-ink);font-family:var(--mono);font-size:12px;margin-left:5px}
.opt-skip{color:var(--ink-3);font-family:var(--mono);font-size:11px;margin-left:5px}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--signal);background:var(--signal-soft);padding:1px 6px;border-radius:3px;margin-bottom:5px}
.q-help{color:var(--ink-3);font-size:13px;margin:0 0 10px;line-height:1.5}

input[type=text],textarea{width:100%;font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:10px 12px;line-height:1.55}
textarea{min-height:80px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
::placeholder{color:var(--ink-3);opacity:.85}

.opts{display:flex;flex-direction:column;gap:7px}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
@media (max-width:460px){.opts.grid{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 12px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line-strong)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin:4px 0 0;accent-color:var(--accent);flex:none}
.opt-t{font-size:14.5px;line-height:1.45;min-width:0}
.opt-n{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.opt:focus-within{outline:2px solid var(--accent);outline-offset:1px}

.err{color:var(--danger);font-size:12.5px;font-family:var(--mono);margin-top:6px}
.q.bad input[type=text],.q.bad textarea{border-color:var(--danger)}

.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
button{font-family:var(--sans);font-size:14.5px;font-weight:600;border-radius:7px;padding:11px 20px;cursor:pointer;border:1px solid transparent;transition:opacity .12s}
button:hover{opacity:.87}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b-pri{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-pri{color:#07100F}}
:root[data-theme="dark"] .b-pri{color:#07100F}
.b-gho{background:transparent;color:var(--ink-2);border-color:var(--line-strong)}
.b-sub{background:var(--surface-2);color:var(--ink);border-color:var(--line-strong)}
.spacer{flex:1}
.saved{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

.verdict{display:grid;gap:10px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px 16px}
.card.warn{border-color:var(--signal);background:var(--signal-soft)}
.card-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.card.warn .card-k{color:var(--signal)}
.card-v{font-size:17px;font-weight:600;letter-spacing:-.01em}
.card-d{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.card.warn .card-d{color:var(--ink)}
#out{font-family:var(--mono);font-size:12.5px;line-height:1.65;min-height:300px;background:var(--surface-2)}
.toast{font-family:var(--mono);font-size:12px;color:var(--ok)}
.empty{color:var(--ink-3);font-size:13.5px;background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:7px;padding:12px 14px}
</style>

</head>
<body>
<div class="bar">
  <div class="bar-in">
    <span class="bar-id">Intake</span>
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="bar-n" id="count">1 / 1</span>
  </div>
</div>

<div class="wrap">
  <div class="masthead">
    <h1>솔루션 의뢰 인테이크</h1>
    <p>만들고 싶은 서비스를 정리하는 질문지입니다. 대부분 보기에서 고르시면 되고, 모르는 항목은 건너뛰셔도 됩니다.</p>
    <div class="meta"><span>약 5분</span><span>자동 임시저장</span><span>마지막에 요약본 복사</span></div>
  </div>
  <div id="stage"></div>
</div>

<script>
/* ───────── 설정 ─────────
   web3forms.com 에서 이메일 주소를 넣으면 액세스 키가 메일로 옵니다 (무료, 가입 불필요).
   그 키를 아래 ACCESS_KEY 에 붙여넣으면, 제출된 의뢰서가 그 주소로 바로 전송됩니다.
   키가 비어 있으면 제출 버튼이 '복사하기'로 대체됩니다.                        */
const CONFIG={
  ACCESS_KEY:'524c7879-3734-412d-81e3-0b0e6a771dd6',                 // 예: 'a1b2c3d4-0000-0000-0000-abcdef123456'
  SUBJECT:'[의뢰서] 새 문의가 접수되었습니다'
};
/* ──────────────────────── */

const O=(v,t,n,x)=>({v,t,n,excl:!!x});
const has=(a,v)=>Array.isArray(a)&&a.indexOf(v)>-1;
const any=a=>Array.isArray(a)&&a.length>0;

const FEATURES=[
 O('login','회원가입 · 로그인'),O('search','검색 · 필터'),O('book','예약 · 일정 잡기'),
 O('order','주문 · 장바구니'),O('pay','결제'),O('chat','채팅 · 문의하기'),
 O('review','리뷰 · 평점'),O('noti','알림 — 문자 · 카톡 · 푸시'),O('map','지도 · 위치'),
 O('upload','사진 · 파일 올리기'),O('admin','관리자 화면'),O('stats','통계 · 리포트'),
 O('lang','다국어'),O('auto','자동화 — 수집 · 외부 연동'),O('point','포인트 · 쿠폰'),
 O('match','사용자끼리 연결 · 매칭')];
const FW={login:2,search:1,book:3,order:3,pay:3,chat:3,review:1,noti:2,map:2,upload:2,admin:3,stats:2,lang:2,auto:3,point:2,match:3};

const SECTIONS=[
{id:'s1',title:'어떤 서비스인가요',note:'연락처와 서비스 성격만 먼저 확인합니다.',qs:[
 {id:'name',t:'text',label:'성함',req:1},
 {id:'contact',t:'text',label:'연락처',help:'이메일 또는 전화번호',req:1},
 {id:'company',t:'text',label:'회사 · 브랜드명',opt:1},
 {id:'kind',t:'radio',label:'어떤 종류에 가장 가까운가요?',req:1,grid:1,o:[
  O('site','소개 홈페이지','회사 · 가게 · 제품 소개'),
  O('book','예약 · 신청 받는 서비스','상담, 수업, 숙박, 시설'),
  O('shop','온라인 판매 · 쇼핑몰','상품을 직접 팝니다'),
  O('market','중개 · 매칭 플랫폼','공급자와 고객을 연결'),
  O('comm','커뮤니티 · 콘텐츠','글, 모임, 구독자'),
  O('inner','업무 시스템 · 자동화','우리 팀이 쓰는 도구'),
  O('app','모바일 앱','앱스토어에 올립니다'),
  O('etc','그 외 · 모르겠음','설명을 듣고 정하고 싶습니다')]},
 {id:'kind_etc',t:'text',label:'어떤 서비스인지 한 단어로 적어주세요',cond:1,if:a=>a.kind==='etc',opt:1},
 {id:'oneliner',t:'textarea',label:'한 문장으로 설명해 주세요',req:1,
  help:'아래 빈칸을 채우듯 적으시면 됩니다. 이 폼에서 직접 쓰는 건 이 항목 하나뿐입니다.',
  ph:'[누가]가 [어떤 상황]에서 [무엇]을 할 수 있게 하는 서비스입니다.\n\n예: 런던에 막 도착한 유학생이 집을 구할 때, 검증된 매물을 한국어로 보고 바로 문의할 수 있게 하는 서비스입니다.'},
]},

{id:'s2',title:'지금 어디까지 와 있나요',note:'준비된 자료와 사용자를 확인합니다.',qs:[
 {id:'stage',t:'radio',label:'지금 어느 단계인가요?',req:1,o:[
  O('idea','아이디어 단계','머릿속에 있고 문서는 없습니다'),
  O('doc','기획서 · 설명자료가 있음','화면 설계는 아직입니다'),
  O('wire','화면 설계까지 되어 있음','플로우 · 와이어프레임 보유'),
  O('live','이미 운영 중','개선 또는 확장이 목적입니다')]},
 {id:'link',t:'text',label:'설계 자료 링크',cond:1,if:a=>a.stage==='wire',opt:1,help:'Figma, 노션, PDF 등'},
 {id:'live_url',t:'text',label:'현재 서비스 주소',cond:1,if:a=>a.stage==='live',opt:1},
 {id:'live_pain',t:'radio',label:'지금 가장 큰 문제는 무엇인가요?',cond:1,if:a=>a.stage==='live',opt:1,o:[
  O('old','낡아서 손보기 어렵다'),O('slow','느리거나 자주 멈춘다'),
  O('manual','사람 손이 너무 많이 간다'),O('lack','필요한 기능이 없다'),O('design','보기에 안 좋다')]},
 {id:'users',t:'check',label:'누가 쓰나요?',opt:1,o:[
  O('guest','아무나 — 로그인 없이 보는 사람'),O('member','가입한 회원 · 고객'),
  O('partner','판매자 · 파트너 · 입점자'),O('staff','우리 직원 · 관리자')]},
]},

{id:'s3',title:'필요한 기능',note:'필요한 것만 골라주세요. 애매하면 일단 체크하고 나중에 빼도 됩니다.',qs:[
 {id:'features',t:'check',label:'이 서비스에 필요한 기능',req:1,grid:1,o:FEATURES},
 {id:'money',t:'radio',label:'서비스 안에서 돈이 오가나요?',req:1,o:[
  O('no','아니요','결제 없이 정보 제공 · 연결만'),
  O('pay','우리가 결제를 받습니다'),
  O('split','받아서 판매자 · 파트너에게 나눠줍니다','정산 기능이 필요합니다'),
  O('sub','구독으로 매달 자동 결제됩니다')]},
 {id:'integ',t:'check',label:'다른 서비스와 연결이 필요한가요?',opt:1,grid:1,o:[
  O('sso','카카오 · 네이버 · 구글 로그인'),O('sms','문자 · 알림톡'),O('mail','이메일 발송'),
  O('map','지도 · 길찾기'),O('ai','번역 · AI'),O('erp','기존 프로그램 · 엑셀 데이터'),
  O('cal','캘린더 · 예약 시스템'),O('none','없거나 모르겠습니다',null,1)]},
 {id:'ops',t:'radio',label:'오픈 후 내용 등록과 수정은 누가 하나요?',opt:1,o:[
  O('self','우리가 직접','관리자 화면이 필요합니다'),
  O('vendor','개발사에 요청','관리자 기능 없이 비용이 줄어듭니다'),
  O('auto','자동으로 들어와야 합니다','수집 · 연동이 필요합니다')]},
]},

{id:'s5',title:'예산과 일정',note:'범위만 알려주시면 맞는 방식을 제안할 수 있습니다.',qs:[
 {id:'budget',t:'radio',label:'생각하고 계신 예산',req:1,o:[
  O('b1','~ 500만원'),O('b2','500 ~ 1,500만원'),O('b3','1,500 ~ 3,000만원'),
  O('b4','3,000만원 ~ 1억'),O('b5','1억 이상'),O('b0','아직 모르겠습니다 — 제안을 받고 싶습니다')]},
 {id:'timeline',t:'radio',label:'언제까지 열고 싶으신가요?',req:1,o:[
  O('t1','1개월 안에'),O('t2','2 ~ 3개월'),O('t3','3 ~ 6개월'),O('t0','급하지 않습니다')]},
 {id:'why_date',t:'radio',label:'그 시점이어야 하는 이유가 있나요?',opt:1,o:[
  O('invest','투자 · 지원사업 일정'),O('event','행사 · 시즌 · 성수기'),
  O('contract','계약 만료 · 기존 시스템 종료'),O('comp','경쟁사보다 먼저'),O('none','특별한 이유는 없습니다')]},
 {id:'later',t:'check',label:'앞에서 고른 기능 중, 2차로 미뤄도 되는 것',opt:1,grid:1,
  help:'하나라도 골라주시면 1차 범위가 줄고 일정이 빨라집니다.',
  odyn:a=>FEATURES.filter(f=>has(a.features,f.v))},
]},

{id:'s6',title:'마지막 확인',note:'두 가지만 더 여쭙겠습니다.',qs:[
 {id:'ref',t:'textarea',label:'참고하고 싶은 서비스가 있다면 주소를 적어주세요',opt:1,
  help:'말로 설명하기 어려운 취향을 가장 빠르게 전달하는 방법입니다.',ph:'한 줄에 하나씩'},
 {id:'worry',t:'radio',label:'이 프로젝트에서 가장 걱정되는 점',opt:1,o:[
  O('cost','비용이 더 들어갈까봐'),O('time','일정이 밀릴까봐'),
  O('qual','품질 · 완성도'),O('comm','소통이 잘 안 될까봐'),
  O('user','만들어도 사람이 안 올까봐'),O('run','오픈 후 운영을 못 할까봐')]},
 {id:'extra',t:'textarea',label:'그 밖에 꼭 알아야 할 것이 있다면',opt:1},
]},
];

let A={},si=0;
try{const r=localStorage.getItem('intake_v3');if(r)A=JSON.parse(r)||{};}catch(e){}
function save(){try{localStorage.setItem('intake_v3',JSON.stringify(A));}catch(e){}}
const opts=q=>q.odyn?q.odyn(A):(q.o||[]);
const vQs=s=>s.qs.filter(q=>!q.if||q.if(A));
const vSec=()=>SECTIONS.filter(s=>(!s.if||s.if(A))&&vQs(s).length);
const stage=document.getElementById('stage');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>(n<10?'0':'')+n;
const toTop=()=>window.scrollTo(0,0);
/* 보이는 질문 구성이 바뀌었는지 비교하는 지문 */
const sig=()=>vSec().map(s=>s.id+':'+vQs(s).map(q=>q.id).join(',')).join('|');
/* 다시 그리지 않고 선택 상태만 반영 */
function syncGroup(q){
  const box=document.getElementById('f_'+q.id);if(!box)return;
  const v=A[q.id];
  box.querySelectorAll('.opt').forEach(l=>{
    const i=l.querySelector('input');if(!i)return;
    const on=q.t==='radio'?v===i.value:has(v,i.value);
    i.checked=on;l.classList.toggle('on',on);
  });
  const e=box.closest('.q');
  if(e){e.classList.remove('bad');const m=e.querySelector('.err');if(m)m.remove();}
}

function render(){
  const secs=vSec(),total=secs.length+1;
  if(si>secs.length)si=secs.length;
  document.getElementById('fill').style.width=(si/(total-1)*100)+'%';
  document.getElementById('count').textContent=(si+1)+' / '+total;
  if(si===secs.length){result();return;}
  const s=secs[si];
  let h='<div class="sec-kicker">'+pad(si+1)+' · Section</div><h2 class="sec-title">'+esc(s.title)+'</h2>';
  if(s.note)h+='<p class="sec-note">'+esc(s.note)+'</p>';
  vQs(s).forEach(q=>{
    h+='<div class="q'+(q.cond?' cond':'')+'" data-q="'+q.id+'">';
    if(q.cond)h+='<span class="tag">앞 답변에 따른 추가 질문</span>';
    h+='<label class="q-label" for="f_'+q.id+'">'+esc(q.label)
      +(q.req?'<span class="req">필수</span>':'<span class="opt-skip">선택</span>')+'</label>';
    if(q.help)h+='<p class="q-help">'+esc(q.help)+'</p>';
    const v=A[q.id],os=opts(q);
    if(q.t==='text')h+='<input type="text" id="f_'+q.id+'" value="'+esc(v||'')+'" placeholder="'+esc(q.ph||'')+'">';
    else if(q.t==='textarea')h+='<textarea id="f_'+q.id+'" placeholder="'+esc(q.ph||'')+'">'+esc(v||'')+'</textarea>';
    else if(!os.length)h+='<div class="empty">앞에서 기능을 고르시면 여기에 표시됩니다.</div>';
    else{
      h+='<div class="opts'+(q.grid?' grid':'')+'" id="f_'+q.id+'">';
      os.forEach(o=>{
        const on=q.t==='radio'?v===o.v:has(v,o.v);
        h+='<label class="opt'+(on?' on':'')+'"><input type="'+(q.t==='radio'?'radio':'checkbox')+'" name="'+q.id+'" value="'+o.v+'"'+(on?' checked':'')+'>'
         +'<span class="opt-t">'+esc(o.t)+(o.n?'<span class="opt-n">'+esc(o.n)+'</span>':'')+'</span></label>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='<div class="nav">'+(si>0?'<button class="b-gho" id="back">이전</button>':'')
   +'<button class="b-pri" id="next">'+(si===secs.length-1?'요약 만들기':'다음')+'</button>'
   +'<span class="spacer"></span><span class="saved">임시저장됨</span></div>';
  stage.innerHTML=h;

  stage.querySelectorAll('input[type=text],textarea').forEach(el=>{
    el.addEventListener('input',()=>{A[el.id.slice(2)]=el.value;save();});
  });
  stage.querySelectorAll('.opt input').forEach(el=>{
    el.addEventListener('change',()=>{
      const qid=el.name,q=s.qs.find(x=>x.id===qid),before=sig();
      if(q.t==='radio')A[qid]=el.value;
      else{
        const os=opts(q);let arr=Array.isArray(A[qid])?A[qid].slice():[];
        const o=os.find(x=>x.v===el.value);
        if(el.checked)arr=o.excl?[el.value]:arr.filter(v=>!(os.find(x=>x.v===v)||{}).excl).concat([el.value]);
        else arr=arr.filter(v=>v!==el.value);
        A[qid]=arr;
      }
      save();
      /* 질문 구성이 그대로면 다시 그리지 않고, 바뀌면 보던 위치를 유지한 채 다시 그린다 */
      if(sig()===before)syncGroup(q);
      else{const y=window.scrollY;render();window.scrollTo(0,y);}
    });
  });
  const b=document.getElementById('back');if(b)b.onclick=()=>{si--;render();toTop();};
  document.getElementById('next').onclick=()=>{
    const miss=vQs(s).filter(q=>q.req&&!((q.t==='text'||q.t==='textarea')?(A[q.id]||'').trim():(q.t==='radio'?A[q.id]:any(A[q.id]))));
    stage.querySelectorAll('.q').forEach(e=>{e.classList.remove('bad');const m=e.querySelector('.err');if(m)m.remove();});
    if(miss.length){
      miss.forEach(q=>{const e=stage.querySelector('[data-q="'+q.id+'"]');e.classList.add('bad');
        const d=document.createElement('div');d.className='err';d.textContent='필수 항목입니다';e.appendChild(d);});
      stage.querySelector('.q.bad').scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    si++;render();toTop();
  };
}

function score(){
  let c=0;
  (A.features||[]).forEach(f=>{if(!has(A.later,f))c+=FW[f]||1;});
  if(A.kind==='app')c+=3;if(A.kind==='market')c+=2;if(A.kind==='shop')c+=2;if(A.kind==='inner')c+=1;
  if(A.money==='pay')c+=2;if(A.money==='sub')c+=3;if(A.money==='split')c+=4;
  c+=Math.min((A.integ||[]).filter(v=>v!=='none').length,5);
  if((A.users||[]).length>2)c+=2;
  if(A.ops==='auto')c+=2;
  const band=c<=8?['소형','2~6주 규모로 보입니다']:c<=18?['중형','2~4개월, 단계를 나누길 권합니다']:['대형','4개월 이상 · 반드시 단계별로 나눠야 합니다'];
  const ready={idea:['아이디어 단계','설계부터 함께 만들어야 합니다'],doc:['기획 보유','화면 설계 단계가 필요합니다'],
   wire:['설계 완료','바로 견적과 개발로 들어갈 수 있습니다'],live:['운영 중','현행 분석이 선행되어야 합니다']}[A.stage]||['미확인',''];
  let fit=null;
  const bmap={b1:1,b2:2,b3:3,b4:4,b5:5},tmap={t1:1,t2:2,t3:3};
  const bi=bmap[A.budget],ti=tmap[A.timeline];
  if(bi&&c>18&&bi<=2)fit=['예산과 범위가 맞지 않습니다','고른 기능 기준으로는 예산을 넘어설 가능성이 큽니다. 2차로 미룰 기능을 더 고르시거나, 핵심만 먼저 여는 방식을 권합니다.'];
  else if(ti&&c>18&&ti===1)fit=['일정이 촉박합니다','이 범위를 한 달 안에 여는 것은 어렵습니다. 범위를 나누는 전제로 논의하겠습니다.'];
  else if(bi&&c<=8&&bi>=4)fit=['예산에 여유가 있습니다','고른 범위 대비 예산이 큽니다. 디자인이나 2차 기능을 당겨올 여지가 있습니다.'];
  return {c,band,ready,fit};
}

function label(q,v){
  const os=opts(q);
  if(q.t==='radio'){const o=os.find(x=>x.v===v);return o?o.t:'';}
  if(q.t==='check')return (v||[]).map(x=>{const o=os.find(y=>y.v===x);return o?o.t:x;}).join(', ');
  return (v||'').trim();
}
function md(){
  const s=score();
  let L=['# 솔루션 의뢰 요약','',
   '- 작성자: '+(A.name||'')+(A.company?' ('+A.company+')':''),
   '- 연락처: '+(A.contact||''),
   '- 작성일: '+new Date().toISOString().slice(0,10),
   '- 준비 상태: '+s.ready[0],
   '- 추정 규모: '+s.band[0]+' (복잡도 '+s.c+'점) — '+s.band[1],
   s.fit?'- 참고: '+s.fit[0]:'',''].filter(x=>x!=='');
  L.push('');
  let n=0;
  vSec().forEach(sec=>{
    const qs=vQs(sec).filter(q=>{const v=A[q.id];return q.t==='check'?any(v):(v||'').toString().trim();});
    if(!qs.length)return;
    n++;L.push('## '+pad(n)+'. '+sec.title,'');
    qs.forEach(q=>{
      const val=label(q,A[q.id]);
      if(val.indexOf('\n')>-1){L.push('**'+q.label+'**','');val.split('\n').forEach(x=>x.trim()&&L.push('- '+x.trim()));L.push('');}
      else L.push('- **'+q.label+'** — '+val);
    });
    L.push('');
  });
  return L.join('\n');
}

async function sendMail(){
  if(!CONFIG.ACCESS_KEY)throw new Error('키가 설정되지 않았습니다');
  const s=score(),c=(A.contact||'').trim();
  const body={
    access_key:CONFIG.ACCESS_KEY,
    subject:CONFIG.SUBJECT+' — '+(A.name||'이름 없음')+(A.company?' / '+A.company:''),
    from_name:(A.name||'의뢰인')+' 의뢰서',
    이름:A.name||'',연락처:c,회사:A.company||'',
    준비상태:s.ready[0],추정규모:s.band[0]+' (복잡도 '+s.c+'점)',
    message:md()
  };
  if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c))body.email=c;
  const r=await fetch('https://api.web3forms.com/submit',{
    method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.success===false)throw new Error(j.message||'전송에 실패했습니다');
}

function result(){
  const s=score(),text=md();
  let h='<div class="sec-kicker">Summary</div><h2 class="sec-title">정리되었습니다</h2>'
   +'<p class="sec-note">내용을 확인하신 뒤 의뢰서를 보내주세요. 이전 버튼으로 돌아가 수정하실 수 있습니다.</p><div class="verdict">'
   +'<div class="card"><div class="card-k">준비 상태</div><div class="card-v">'+s.ready[0]+'</div><div class="card-d">'+s.ready[1]+'</div></div>'
   +'<div class="card"><div class="card-k">추정 규모 · 복잡도 '+s.c+'점</div><div class="card-v">'+s.band[0]+'</div><div class="card-d">'+s.band[1]+'</div></div>';
  if(s.fit)h+='<div class="card warn"><div class="card-k">예산 · 일정</div><div class="card-v">'+s.fit[0]+'</div><div class="card-d">'+s.fit[1]+'</div></div>';
  h+='</div><div id="sent"></div>'
   +'<div id="fallback" hidden><p class="q-help">자동 전송이 되지 않았습니다. 아래 내용을 복사해 담당자에게 보내주세요.</p>'
   +'<textarea id="out" readonly>'+esc(text)+'</textarea>'
   +'<div class="nav"><button class="b-pri" id="copy">요약본 복사</button>'
   +'<span class="spacer"></span><span class="toast" id="toast"></span></div></div>'
   +'<div class="nav" id="mainnav"><button class="b-gho" id="back">이전</button>'
   +'<button class="b-pri" id="send">의뢰서 보내기</button>'
   +'<button class="b-sub" id="reset">처음부터</button>'
   +'<span class="spacer"></span><span class="toast" id="status"></span></div>';
  stage.innerHTML=h;
  document.getElementById('back').onclick=()=>{si--;render();toTop();};
  document.getElementById('reset').onclick=()=>{A={};si=0;save();render();toTop();};
  document.getElementById('copy').onclick=()=>{
    const ta=document.getElementById('out'),t=document.getElementById('toast');
    const done=()=>{t.textContent='복사했습니다';setTimeout(()=>t.textContent='',2500);};
    const fb=()=>{ta.select();t.textContent='전체 선택됨 — 직접 복사해 주세요';};
    try{navigator.clipboard.writeText(ta.value).then(done,fb);}catch(e){fb();}
  };
  const btn=document.getElementById('send'),st=document.getElementById('status');
  btn.onclick=async()=>{
    btn.disabled=true;btn.textContent='보내는 중…';st.textContent='';
    try{
      await sendMail();
      document.getElementById('sent').innerHTML=
        '<div class="card"><div class="card-k">접수 완료</div><div class="card-v">의뢰서를 보냈습니다</div>'
        +'<div class="card-d">담당자가 확인 후 '+esc((A.contact||'남겨주신 연락처'))+'로 회신드리겠습니다.</div></div>';
      btn.remove();
      document.getElementById('reset').textContent='새 의뢰서 작성';
      toTop();
    }catch(e){
      btn.disabled=false;btn.textContent='다시 보내기';
      st.textContent='';
      const f=document.getElementById('fallback');f.hidden=false;
      f.scrollIntoView({behavior:'smooth',block:'start'});
    }
  };
}
render();
</script>
